services:
  backend:
    image: ghcr.io/298rehan/hvac-protection-platform-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Runtime configuration, later files overriding earlier ones:
    #   deploy/production.env - committed, non-secret AWS settings
    #   .env, backend/.env    - server-only secrets (JWT_SECRET_KEY, DATABASE_URL,
    #                           SMTP, ...); git-ignored, never committed
    # AWS credentials are not configured anywhere: boto3 uses the EC2 role.
    env_file:
      - path: ./deploy/production.env
        required: true
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 250M

  admin-frontend:
    image: ghcr.io/298rehan/hvac-protection-platform-admin:${IMAGE_TAG:-latest}
    build: ./admin-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 300M

  customer-frontend:
    image: ghcr.io/298rehan/hvac-protection-platform-customer:${IMAGE_TAG:-latest}
    build: ./customer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 300M
