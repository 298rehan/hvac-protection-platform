version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 250M

  admin-frontend:
    build: ./admin-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 300M

  customer-frontend:
    build: ./customer-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 300M
