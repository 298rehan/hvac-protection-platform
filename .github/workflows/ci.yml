name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-frontend:
    name: Admin Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install Admin Dependencies
        working-directory: admin-frontend
        run: npm ci

      - name: Build Admin Frontend
        working-directory: admin-frontend
        run: npm run build


  customer-frontend:
    name: Customer Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: customer-frontend/package-lock.json

      - name: Install Customer Dependencies
        working-directory: customer-frontend
        run: npm ci

      - name: Build Customer Frontend
        working-directory: customer-frontend
        run: npm run build


  deploy:
    name: Deploy
    needs:
      - admin-frontend
      - customer-frontend

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deployment
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"